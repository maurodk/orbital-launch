server {
    listen 80;
    listen [::]:80;
    
    server_name _;  # Responde para qualquer domínio/IP
    
    # Redirecionar HTTP para HTTPS (descomentar após configurar SSL)
    # return 301 https://$server_name$request_uri;
    
    location / {

        # Se for uma requisição OPTIONS (Preflight), o Nginx responde antes de mandar pro Node
        if ($request_method = 'OPTIONS') {
            # CORS headers apenas para preflight
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Accept' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Importante: NÃO adicione add_header CORS fora do bloco OPTIONS!
        # O Node.js/Express deve ser responsável por enviar os headers CORS nas respostas normais (GET, POST, etc.)
        # Se adicionar add_header fora do bloco OPTIONS, pode causar conflito ou sobrescrever o header do backend.

        proxy_pass http://localhost:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Remova ou comente as linhas antigas de 'add_header' que estavam aqui
        # Deixe o Node.js enviar os headers nas requisições normais (GET, POST)
        
        # SSE Config
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 24h; # Importante para manter o SSE vivo
    }
}
