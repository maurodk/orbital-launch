<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <link rel="icon" type="image/x-icon" href="/v.ico" />
    <title>Espelho de Implantação - VCA</title>
    <style>
      :root {
        --color-disponivel: #6ad700;
        --color-Reservada: #d9534f;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #221f25;
        color: #fff;
      }
      .topbar {
        padding: 10px 16px;
        background: #0b0b0b;
        display: flex;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid #333;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .topbar.hidden {
        opacity: 0;
        transform: translateY(-100%);
        pointer-events: none;
      }
      .title {
        font-size: 18px;
        font-weight: 600;
      }
      .logo {
        height: 30px;
      }
      .floor-plan-wrapper {
        position: relative;
        width: 100%;
        height: calc(100vh - 51px);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #1a1a1a;
        transition: height 0.3s ease;
      }
      .floor-plan-wrapper.fullscreen {
        height: 100vh;
      }
      .floor-plan-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .floor-plan-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0.9;
      }
      .unit-indicator {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
        transition: transform 0.2s ease, background-color 0.3s ease;
        cursor: help;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .unit-indicator .letra {
        font-size: 6px;
        font-weight: bold;
        color: white;
        text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }

      .status-Reservada {
        background: var(--color-Reservada);
      }
      .status-Disponível {
        background: var(--color-disponivel);
      }
      .status-Bloqueada {
        background: var(--color-Reservada);
      }
      .status-other {
        background: #6c757d;
      }
      /* Esconder unidades disponíveis quando toggle ativado */
      .hide-disponivel .status-Disponível {
        display: none !important;
      }
      .small {
        font-size: 14px;
        color: #ccc;
      }
      .fullscreen-button {
        background: #333;
        border: 1px solid #555;
        color: #fff;
        width: 36px;
        height: 36px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .fullscreen-button:hover {
        background: #444;
      }
      .dot-size-control {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.85);
        padding: 12px 18px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 9999;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        min-width: 200px;
        pointer-events: auto;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .dot-size-control.hidden {
        opacity: 0;
        transform: translateY(20px);
        pointer-events: none;
      }
      .dot-size-control label {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        color: #fff;
        text-align: center;
      }
      .dot-size-control input[type="range"] {
        width: 100%;
        cursor: pointer;
      }
      .dot-size-value {
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        color: #6ad700;
        margin-top: 2px;
      }
      .dot-color-control {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.85);
        padding: 12px 18px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 9999;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        min-width: 220px;
        pointer-events: auto;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .dot-color-control.hidden {
        opacity: 0;
        transform: translateY(20px);
        pointer-events: none;
      }
      .dot-color-control h3 {
        margin: 0 0 8px 0;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        color: #fff;
      }
      .color-option {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: space-between;
      }
      .color-option label {
        font-size: 12px;
        font-weight: 500;
        color: #fff;
        flex: 1;
      }
      .color-option input[type="color"] {
        width: 50px;
        height: 30px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        cursor: pointer;
        background: transparent;
      }
      .color-option input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }
      .color-option input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 3px;
      }
      .toggle-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .toggle-option label {
        font-size: 12px;
        font-weight: 500;
        color: #fff;
        cursor: pointer;
      }
      .toggle-switch {
        position: relative;
        width: 44px;
        height: 24px;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #555;
        transition: 0.3s;
        border-radius: 24px;
      }
      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.3s;
        border-radius: 50%;
      }
      .toggle-switch input:checked + .toggle-slider {
        background-color: #6ad700;
      }
      .toggle-switch input:checked + .toggle-slider:before {
        transform: translateX(20px);
      }
      .toast-notification {
        position: fixed;
        bottom: 80px;
        right: 20px;
        background-color: #28a745;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        z-index: 10000;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        pointer-events: none;
      }
      .toast-notification.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="title" id="empreendimento-title">Espelho de Implantação</div>
      <div id="implantacaoName" class="small"></div>
      <div style="flex: 1"></div>
      <button
        id="fullscreen-btn"
        class="fullscreen-button"
        title="Ativar Tela Cheia"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
          ></path>
        </svg>
      </button>
      <button
        id="refresh-btn"
        class="fullscreen-button"
        title="Atualizar dados"
        style="margin-left: 8px"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path
            d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
          ></path>
        </svg>
      </button>
      <div id="status" class="small">Conectando...</div>
    </div>

    <div id="floor-plan-wrapper"></div>

    <!-- Controles fixos fora do wrapper -->
    <div class="dot-size-control">
      <label for="dot-size-slider">Tamanho dos Pontos</label>
      <input
        type="range"
        id="dot-size-slider"
        min="8"
        max="40"
        value="16"
        step="1"
      />
      <div class="dot-size-value"><span id="dot-size-value">16</span> px</div>
    </div>

    <div class="dot-color-control">
      <h3>Cores dos Pontos</h3>
      <div class="color-option">
        <label for="color-disponivel">Disponível</label>
        <input type="color" id="color-disponivel" value="#6ad700" />
      </div>
      <div class="color-option">
        <label for="color-Reservada">Reservada</label>
        <input type="color" id="color-Reservada" value="#d9534f" />
      </div>
      <div class="toggle-option">
        <label for="hide-disponivel">Esconder Disponíveis</label>
        <label class="toggle-switch">
          <input type="checkbox" id="hide-disponivel" />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div id="toast-notification" class="toast-notification">
      Tamanho do ponto salvo!
    </div>

    <script>
      (function () {
        // Detecta automaticamente se está em desenvolvimento ou produção
        const API_URL =
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
            ? "http://localhost:3000"
            : "https://apitelaodigital.suportevca.com.br";

        const wrapper = document.getElementById("floor-plan-wrapper");
        const statusEl = document.getElementById("status");
        const implantacaoNameEl = document.getElementById("implantacaoName");
        const empreendimentoTitleEl = document.getElementById(
          "empreendimento-title"
        );
        const dotSizeSlider = document.getElementById("dot-size-slider");
        const dotSizeValueEl = document.getElementById("dot-size-value");
        const toast = document.getElementById("toast-notification");
        const fullscreenBtn = document.getElementById("fullscreen-btn");
        const refreshBtn = document.getElementById("refresh-btn");

        const urlParams = new URLSearchParams(location.search);
        const implantacao = urlParams.get("implantacao");

        if (!implantacao) {
          wrapper.innerHTML =
            '<p style="padding:20px">Parâmetro "implantacao" não encontrado na URL.</p>';
          statusEl.textContent = "Erro";
          return;
        }

        implantacaoNameEl.textContent = implantacao;
        empreendimentoTitleEl.textContent = `Espelho - ${implantacao}`;

        // Refresh inteligente que preserva o estado de fullscreen
        function smartRefresh() {
          const wasFullscreen = !!document.fullscreenElement;
          const hideAvailable = hideDisponivelToggle?.checked
            ? "true"
            : "false";

          reloadAndRender(hideAvailable).then(() => {
            if (wasFullscreen) {
              // Mantém em fullscreen após refresh
              if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                  console.error("Erro ao reativar fullscreen:", err);
                });
              }
            }
          });
        }

        // Auto-refresh a cada 30 segundos para sincronizar dados
        let autoRefreshInterval = setInterval(() => {
          console.log("Auto-refresh executado");
          const hideAvailable = hideDisponivelToggle?.checked
            ? "true"
            : "false";
          reloadAndRender(hideAvailable);
        }, 30000); // 30 segundos

        async function fetchData(hideAvailable = "false") {
          try {
            const url = `${API_URL}/api/public-data?implantacao=${encodeURIComponent(
              implantacao
            )}&hideAvailable=${hideAvailable}`;
            const res = await fetch(url);
            if (!res.ok) {
              throw new Error(`Falha ao buscar dados: ${res.statusText}`);
            }
            const json = await res.json();
            return json;
          } catch (e) {
            console.error("Erro em fetchData:", e);
            statusEl.textContent = "Erro ao carregar dados.";
            return { unidades: [], imageUrl: "", dotSize: 16 };
          }
        }

        function render(data) {
          const { unidades, imageUrl, dotSize } = data;
          wrapper.innerHTML = "";

          window.currentDotSize = dotSize;
          dotSizeSlider.value = dotSize;

          // Atualiza o valor exibido inicial
          if (dotSizeValueEl) {
            dotSizeValueEl.textContent = dotSize;
          }

          if (!imageUrl) {
            wrapper.innerHTML =
              '<p style="padding:20px">Imagem da planta não configurada.</p>';
            return;
          }

          const container = document.createElement("div");
          container.className = "floor-plan-container";

          const img = document.createElement("img");
          img.src = imageUrl;
          img.className = "floor-plan-image";

          container.appendChild(img);
          wrapper.appendChild(container);

          const rows =
            unidades.length > 0 &&
            unidades[0][0]?.toString().toLowerCase().includes("etapa")
              ? unidades.slice(1)
              : unidades;

          rows.forEach((u, index) => {
            const coordX = u[12];
            const coordY = u[13];
            const letra = u[18];
            const status = (u[11] || "Disponível").toString().toUpperCase();

            if (!coordX || !coordY) {
              return;
            }

            const indicator = document.createElement("div");
            const unitIndex = index;
            indicator.id = `unit-indicator-${unitIndex}`;
            indicator.className = `unit-indicator status-${status}`;
            indicator.style.left = `${coordX}%`;
            indicator.style.top = `${coordY}%`;
            indicator.style.width = `${dotSize}px`;
            indicator.style.height = `${dotSize}px`;
            indicator.title = `Unidade: ${u[2]}\nStatus: ${status}`;

            if (letra) {
              const letraSpan = document.createElement("span");
              letraSpan.className = "letra";
              letraSpan.textContent = letra;
              letraSpan.style.fontSize = `${Math.max(dotSize * 0.25, 6)}px`;
              indicator.appendChild(letraSpan);
            }

            container.appendChild(indicator);
          });
        }

        async function reloadAndRender(hideAvailable = "false") {
          statusEl.textContent = "Atualizando...";
          const data = await fetchData(hideAvailable);
          render(data);
          statusEl.textContent = "Conectado";
        }

        let es;
        function connectSse() {
          if (es) es.close();

          es = new EventSource(
            `${API_URL}/api/events?implantacao=${encodeURIComponent(
              implantacao
            )}`
          );

          es.onopen = () => {
            statusEl.textContent = "Conectado em tempo real";
          };

          es.onerror = () => {
            statusEl.textContent = "Erro na conexão. Reconectando...";
            setTimeout(connectSse, 5000);
          };

          es.addEventListener("unitUpdated", async (ev) => {
            try {
              const { unitData, rowIndex } = JSON.parse(ev.data);
              console.log("Evento 'unit-updated' recebido:", {
                unitData,
                rowIndex,
              });
              updateSingleUnit(unitData, rowIndex);
            } catch (e) {
              console.error("Erro ao processar evento SSE:", e);
            }
          });
        }

        function updateSingleUnit(unitData, rowIndex) {
          const container = document.querySelector(".floor-plan-container");
          if (!container) return;

          const unitIndex = rowIndex - 2;
          const unitId = `unit-indicator-${unitIndex}`;
          let indicator = document.getElementById(unitId);

          const coordX = unitData[12];
          const coordY = unitData[13];
          const letra = unitData[18];
          const status = (unitData[11] || "Disponível")
            .toString()
            .toUpperCase();

          if (!coordX || !coordY) {
            if (indicator) {
              indicator.remove();
            }
            return;
          }

          if (!indicator) {
            indicator = document.createElement("div");
            indicator.id = unitId;
            indicator.className = "unit-indicator";
            container.appendChild(indicator);
          }

          indicator.className = `unit-indicator status-${status}`;
          indicator.style.left = `${coordX}%`;
          indicator.style.top = `${coordY}%`;
          indicator.title = `Unidade: ${unitData[2]}\nStatus: ${status}`;

          const dotSize = window.currentDotSize || 16;
          indicator.style.width = `${dotSize}px`;
          indicator.style.height = `${dotSize}px`;

          indicator.innerHTML = "";
          if (letra) {
            const letraSpan = document.createElement("span");
            letraSpan.className = "letra";
            letraSpan.textContent = letra;
            letraSpan.style.fontSize = `${Math.max(dotSize * 0.25, 6)}px`;
            indicator.appendChild(letraSpan);
          }

          console.log(
            `[FULLSCREEN] Unidade ${unitData[2]} atualizada para status: ${status}`
          );
        }

        function updateAllDotSizes(newSize) {
          const indicators = document.querySelectorAll(".unit-indicator");
          indicators.forEach((indicator) => {
            indicator.style.width = `${newSize}px`;
            indicator.style.height = `${newSize}px`;
            const letraSpan = indicator.querySelector(".letra");
            if (letraSpan) {
              letraSpan.style.fontSize = `${Math.max(newSize * 0.25, 6)}px`;
            }
          });
          window.currentDotSize = newSize;

          // Atualiza o valor exibido
          if (dotSizeValueEl) {
            dotSizeValueEl.textContent = newSize;
          }
        }

        async function saveDotSize(newSize) {
          try {
            const res = await fetch(`${API_URL}/api/update-dot-size`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                implantacaoName: implantacao,
                newSize: newSize,
              }),
            });
            if (res.ok) {
              showToast();
            } else {
              console.error("Falha ao salvar o tamanho do ponto.");
            }
          } catch (error) {
            console.error("Erro de rede ao salvar o tamanho do ponto:", error);
          }
        }

        function showToast(message = "Tamanho do ponto salvo!") {
          toast.textContent = message;
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 2000);
        }

        reloadAndRender(urlParams.get("hideAvailable") || "false");
        connectSse();

        fullscreenBtn.addEventListener("click", () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch((err) => {
              alert(
                `Erro ao tentar ativar tela cheia: ${err.message} (${err.name})`
              );
            });
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            }
          }
        });

        // Botão de refresh manual
        refreshBtn.addEventListener("click", () => {
          smartRefresh();
          showToast("Dados atualizados!");
        });

        const topbar = document.querySelector(".topbar");
        const dotSizeControl = document.querySelector(".dot-size-control");
        const dotColorControl = document.querySelector(".dot-color-control");
        const colorDisponivelInput =
          document.getElementById("color-disponivel");
        const colorReservadaInput = document.getElementById("color-Reservada");
        let isFullscreenMode = false;
        let hideHeaderTimeout = null;

        function showTopbar() {
          topbar.classList.remove("hidden");
          dotSizeControl.classList.remove("hidden");
          dotColorControl.classList.remove("hidden");
          wrapper.classList.remove("fullscreen");

          // Cancela timeout anterior se existir
          if (hideHeaderTimeout) {
            clearTimeout(hideHeaderTimeout);
          }

          // Se estiver em modo fullscreen, agenda o ocultamento automático
          if (isFullscreenMode) {
            hideHeaderTimeout = setTimeout(() => {
              hideTopbar();
            }, 3000); // 3 segundos de inatividade
          }
        }

        function hideTopbar() {
          topbar.classList.add("hidden");
          dotSizeControl.classList.add("hidden");
          dotColorControl.classList.add("hidden");
          wrapper.classList.add("fullscreen");

          // Cancela qualquer timeout pendente
          if (hideHeaderTimeout) {
            clearTimeout(hideHeaderTimeout);
            hideHeaderTimeout = null;
          }
        }

        function enableFullscreenMode() {
          isFullscreenMode = true;
          hideTopbar();
        }

        function disableFullscreenMode() {
          isFullscreenMode = false;
          showTopbar();

          // Cancela timeout ao sair do fullscreen
          if (hideHeaderTimeout) {
            clearTimeout(hideHeaderTimeout);
            hideHeaderTimeout = null;
          }
        }

        function showHeaderOnInteraction() {
          if (isFullscreenMode) {
            showTopbar();
          }
        }

        document.addEventListener("mousemove", showHeaderOnInteraction);
        document.addEventListener("mousedown", showHeaderOnInteraction);
        document.addEventListener("keydown", showHeaderOnInteraction);
        document.addEventListener("touchstart", showHeaderOnInteraction);
        document.addEventListener("touchmove", showHeaderOnInteraction);

        topbar.addEventListener("mouseenter", () => {
          if (isFullscreenMode) {
            showTopbar();
          }
        });

        // Mantém visível quando interage com o controle
        dotSizeControl.addEventListener("mouseenter", () => {
          if (isFullscreenMode) {
            showTopbar();
          }
        });

        dotColorControl.addEventListener("mouseenter", () => {
          if (isFullscreenMode) {
            showTopbar();
          }
        });

        // Controles de cor
        function updateColors() {
          const disponivelColor = colorDisponivelInput.value;
          const ReservadaColor = colorReservadaInput.value;

          // Atualiza variáveis CSS
          document.documentElement.style.setProperty(
            "--color-disponivel",
            disponivelColor
          );
          document.documentElement.style.setProperty(
            "--color-Reservada",
            ReservadaColor
          );

          // Salva no localStorage
          localStorage.setItem("dot-color-disponivel", disponivelColor);
          localStorage.setItem("dot-color-Reservada", ReservadaColor);
        }

        // Carrega cores salvas do localStorage
        function loadSavedColors() {
          const savedDisponivel = localStorage.getItem("dot-color-disponivel");
          const savedReservada = localStorage.getItem("dot-color-Reservada");

          if (savedDisponivel) {
            colorDisponivelInput.value = savedDisponivel;
            document.documentElement.style.setProperty(
              "--color-disponivel",
              savedDisponivel
            );
          }

          if (savedReservada) {
            colorReservadaInput.value = savedReservada;
            document.documentElement.style.setProperty(
              "--color-Reservada",
              savedReservada
            );
          }
        }

        // Carrega cores ao iniciar
        loadSavedColors();

        colorDisponivelInput.addEventListener("input", updateColors);
        colorReservadaInput.addEventListener("input", updateColors);

        // Toggle para esconder disponíveis
        const hideDisponivelToggle = document.getElementById("hide-disponivel");

        function updateHideDisponivel() {
          const isHidden = hideDisponivelToggle.checked;

          if (isHidden) {
            wrapper.classList.add("hide-disponivel");
          } else {
            wrapper.classList.remove("hide-disponivel");
          }

          // Salva no localStorage
          localStorage.setItem("hide-disponivel", isHidden);
        }

        // Carrega estado salvo do toggle
        function loadHideDisponivelState() {
          const savedState = localStorage.getItem("hide-disponivel");
          if (savedState === "true") {
            hideDisponivelToggle.checked = true;
            wrapper.classList.add("hide-disponivel");
          }
        }

        // Carrega estado ao iniciar
        loadHideDisponivelState();

        hideDisponivelToggle.addEventListener("change", updateHideDisponivel);

        // Detecta quando entra/sai do fullscreen do navegador
        document.addEventListener("fullscreenchange", () => {
          if (document.fullscreenElement) {
            enableFullscreenMode();
          } else {
            disableFullscreenMode();
          }
        });

        disableFullscreenMode();

        dotSizeSlider.addEventListener("input", (event) => {
          updateAllDotSizes(event.target.value);
        });

        dotSizeSlider.addEventListener("change", (event) => {
          saveDotSize(event.target.value);
        });
      })();
    </script>
  </body>
</html>
