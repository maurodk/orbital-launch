<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <link rel="icon" type="image/x-icon" href="/v.ico" />
    <title>Espelho de Implantação - VCA</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #111;
        color: #fff;
        overflow: hidden; /* Remove barra de rolagem vertical */
      }
      .topbar {
        padding: 10px 16px;
        background: #0b0b0b;
        display: flex;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid #333;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .topbar.hidden {
        opacity: 0;
        transform: translateY(-100%);
        pointer-events: none;
      }
      .title {
        font-size: 18px;
        font-weight: 600;
      }
      .logo {
        height: 30px;
      }
      .floor-plan-wrapper {
        position: relative;
        width: 100%;
        height: calc(100vh - 51px); /* Altura da tela menos o topbar */
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #1a1a1a;
        transition: height 0.3s ease;
        margin: 0;
        padding: 0;
      }
      .floor-plan-wrapper.fullscreen {
        height: 100vh; /* Altura total da tela quando topbar está oculto */
        background-color: #111; /* Mesma cor do body para evitar área preta */
      }
      .floor-plan-container {
        position: relative;
        max-width: 100%;
        max-height: 100%;
      }
      .floor-plan-image {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        opacity: 0.9;
        transition: all 0.3s ease;
      }

      .floor-plan-image.fullscreen-mode {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
      }
      .unit-indicator {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 16px; /* Tamanho padrão, será sobrescrito */
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
        transition: transform 0.2s ease, background-color 0.3s ease;
        cursor: help;
        z-index: 11; /* Garantir que os pontos fiquem acima da imagem */
      }

      .unit-indicator.fullscreen-mode {
        position: fixed; /* Mesmo posicionamento da imagem */
        z-index: 12; /* Acima da imagem em fullscreen */
      }
      .status-RESERVADA {
        background: #d9534f;
      }
      .status-DISPONÍVEL {
        background: #6ad700;
      }
      .status-BLOQUEADA {
        background: #d9534f; /* Usando a mesma cor de reservada */
      }
      .status-other {
        background: #6c757d;
      }
      .small {
        font-size: 14px;
        color: #ccc;
      }
      .fullscreen-button {
        background: #333;
        border: 1px solid #555;
        color: #fff;
        width: 36px;
        height: 36px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .fullscreen-button:hover {
        background: #444;
      }

      /* Controles de Zoom */
      .zoom-controls {
        position: fixed;
        top: 70px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .zoom-controls.visible {
        opacity: 1;
      }

      .zoom-button {
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid #555;
        color: #fff;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: bold;
        transition: all 0.2s ease;
        backdrop-filter: blur(10px);
      }

      .zoom-button:hover {
        background: rgba(0, 0, 0, 0.9);
        border-color: #777;
        transform: scale(1.05);
      }

      .zoom-button:active {
        transform: scale(0.95);
      }

      .zoom-reset {
        background: rgba(46, 213, 115, 0.2);
        border-color: #2ed573;
        font-size: 14px;
      }

      .zoom-reset:hover {
        background: rgba(46, 213, 115, 0.3);
      }

      /* Container da imagem com zoom */
      .floor-plan-container {
        position: relative;
        width: 100%;
        height: 100%;
        transform-origin: center center;
        transition: transform 0.3s ease;
        cursor: grab;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Otimizações de performance para mobile */
        will-change: transform;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
      }

      .floor-plan-container.dragging {
        cursor: grabbing;
      }

      .floor-plan-container.zoomed {
        cursor: grab;
      }

      .floor-plan-container.fullscreen-mode {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 10;
      }

      /* Indicador de zoom */
      .zoom-indicator {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.3s ease;
        backdrop-filter: blur(10px);
        border: 1px solid #333;
        z-index: 1000;
      }

      .zoom-indicator.visible {
        opacity: 1;
      }

      /* Instruções de uso */
      .zoom-instructions {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: #ccc;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.3s ease;
        backdrop-filter: blur(10px);
        border: 1px solid #333;
        z-index: 1000;
        text-align: center;
        max-width: 300px;
      }

      .zoom-instructions.visible {
        opacity: 1;
      }

      /* Responsividade para mobile */
      @media (max-width: 768px) {
        .zoom-controls {
          top: 60px;
          right: 10px;
        }

        .zoom-button {
          width: 36px;
          height: 36px;
          font-size: 16px;
        }

        .zoom-indicator {
          top: 15px;
          font-size: 12px;
          padding: 6px 12px;
        }

        .zoom-instructions {
          bottom: 15px;
          font-size: 11px;
          padding: 10px 15px;
          max-width: 250px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="title" id="empreendimento-title">Espelho de Implantação</div>
      <div id="implantacaoName" class="small"></div>
      <div style="flex: 1"></div>
      <button
        id="fullscreen-btn"
        class="fullscreen-button"
        title="Ativar Tela Cheia"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
          ></path>
        </svg>
      </button>
      <div id="status" class="small">Conectando...</div>
    </div>
    <div id="floor-plan-wrapper">
      <!-- A imagem e os pontos serão inseridos aqui via script -->
    </div>

    <!-- Controles de Zoom -->
    <div class="zoom-controls" id="zoom-controls">
      <button
        class="zoom-button"
        id="zoom-in"
        title="Zoom In (+)"
        data-action="zoom-in"
      >
        +
      </button>
      <button
        class="zoom-button"
        id="zoom-out"
        title="Zoom Out (-)"
        data-action="zoom-out"
      >
        −
      </button>
      <button
        class="zoom-button zoom-reset"
        id="zoom-reset"
        title="Reset Zoom"
        data-action="zoom-reset"
      >
        ⌂
      </button>
    </div>

    <!-- Indicador de Zoom -->
    <div class="zoom-indicator" id="zoom-indicator">
      Zoom: <span id="zoom-level">100%</span>
    </div>

    <!-- Instruções de Uso -->
    <div class="zoom-instructions" id="zoom-instructions">
      <div>
        🖱️ <strong>Mouse:</strong> Scroll para zoom | Arrastar para mover
      </div>
      <div>
        📱 <strong>Touch:</strong> Pinch para zoom | Toque e arraste para mover
      </div>
    </div>

    <script>
      // IIFE para encapsular a lógica e evitar poluir o escopo global
      (function () {
        const wrapper = document.getElementById("floor-plan-wrapper");
        const statusEl = document.getElementById("status");
        const implantacaoNameEl = document.getElementById("implantacaoName");
        const empreendimentoTitleEl = document.getElementById(
          "empreendimento-title"
        );
        const fullscreenBtn = document.getElementById("fullscreen-btn");

        // Elementos de zoom
        const zoomControls = document.getElementById("zoom-controls");
        const zoomIndicator = document.getElementById("zoom-indicator");
        const zoomLevel = document.getElementById("zoom-level");
        const zoomInstructions = document.getElementById("zoom-instructions");

        // Variáveis de zoom
        let currentZoom = 1;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let currentTranslate = { x: 0, y: 0 };
        let container = null;
        let maxZoom = 1; // Será calculado baseado no tamanho real da imagem

        // Variáveis para pinch-to-zoom
        let initialPinchDistance = 0;
        let initialPinchZoom = 1;
        let isPinching = false;

        const urlParams = new URLSearchParams(location.search);
        const implantacao = urlParams.get("implantacao");

        if (!implantacao) {
          wrapper.innerHTML =
            '<p style="padding:20px">Parâmetro "implantacao" não encontrado na URL.</p>';
          statusEl.textContent = "Erro";
          return;
        }

        implantacaoNameEl.textContent = implantacao;
        empreendimentoTitleEl.textContent = `Espelho - ${implantacao}`;

        // Função para buscar os dados da API
        async function fetchData(hideAvailable = "false") {
          try {
            const url = `/api/public-data?implantacao=${encodeURIComponent(
              implantacao
            )}&hideAvailable=${hideAvailable}`;
            const res = await fetch(url);
            if (!res.ok) {
              throw new Error(`Falha ao buscar dados: ${res.statusText}`);
            }
            const json = await res.json();
            return json; // Retorna o objeto completo
          } catch (e) {
            console.error("Erro em fetchData:", e);
            statusEl.textContent = "Erro ao carregar dados.";
            return { unidades: [], imageUrl: "", dotSize: 16 };
          }
        }

        // Funções de Zoom e Arrastar
        function updateZoomDisplay() {
          zoomLevel.textContent = Math.round(currentZoom * 100) + "%";
          if (currentZoom > 1) {
            zoomIndicator.classList.add("visible");
            zoomControls.classList.add("visible");
            zoomInstructions.classList.add("visible");
          } else {
            zoomIndicator.classList.remove("visible");
            zoomControls.classList.remove("visible");
            zoomInstructions.classList.remove("visible");
          }
        }

        function applyTransform() {
          if (!container) return;
          container.style.transform = `translate(${currentTranslate.x}px, ${currentTranslate.y}px) scale(${currentZoom})`;
          container.classList.toggle("zoomed", currentZoom > 1);

          // Ajustar posições dos pontos baseado no zoom atual
          updateUnitPositions();
        }

        // Função para atualizar as posições dos pontos baseado no zoom e modo
        function updateUnitPositions() {
          const indicators = document.querySelectorAll(".unit-indicator");
          const isFullscreen = document.fullscreenElement !== null;

          indicators.forEach((indicator) => {
            // Obter as coordenadas originais do atributo data
            const originalX = parseFloat(
              indicator.getAttribute("data-original-x") || indicator.style.left
            );
            const originalY = parseFloat(
              indicator.getAttribute("data-original-y") || indicator.style.top
            );

            // Salvar coordenadas originais se ainda não foram salvas
            if (!indicator.hasAttribute("data-original-x")) {
              indicator.setAttribute("data-original-x", originalX);
              indicator.setAttribute("data-original-y", originalY);
            }

            // Calcular posições baseadas no modo atual
            if (
              isFullscreen &&
              container &&
              container.classList.contains("fullscreen-mode")
            ) {
              // No fullscreen, ajustar baseado na proporção da imagem
              const img = document.querySelector(".floor-plan-image");
              if (img) {
                const imgRect = img.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                // Calcular offsets para centralizar a imagem no container
                const offsetX = (containerRect.width - imgRect.width) / 2;
                const offsetY = (containerRect.height - imgRect.height) / 2;

                // Converter coordenadas percentuais para pixels baseadas no tamanho real da imagem
                const pixelX = (originalX / 100) * imgRect.width + offsetX;
                const pixelY = (originalY / 100) * imgRect.height + offsetY;

                // Converter para porcentagem do container
                const containerX = (pixelX / containerRect.width) * 100;
                const containerY = (pixelY / containerRect.height) * 100;

                indicator.style.left = `${Math.max(
                  0,
                  Math.min(100, containerX)
                )}%`;
                indicator.style.top = `${Math.max(
                  0,
                  Math.min(100, containerY)
                )}%`;
              } else {
                // Fallback para coordenadas originais
                indicator.style.left = `${originalX}%`;
                indicator.style.top = `${originalY}%`;
              }
            } else {
              // Modo normal - usar coordenadas originais
              indicator.style.left = `${originalX}%`;
              indicator.style.top = `${originalY}%`;
            }
          });
        }

        function zoomIn() {
          currentZoom = Math.min(currentZoom * 1.2, maxZoom);
          updateZoomDisplay();
          applyTransform();
        }

        function zoomOut() {
          const newZoom = Math.max(currentZoom / 1.2, 1); // Zoom mínimo é 1 (tamanho responsivo)

          // Se estamos voltando para o zoom 1, resetar a posição também
          if (newZoom === 1) {
            currentTranslate = { x: 0, y: 0 };
          }

          currentZoom = newZoom;
          updateZoomDisplay();
          applyTransform();
        }

        function resetZoom() {
          currentZoom = 1;
          currentTranslate = { x: 0, y: 0 };
          updateZoomDisplay();
          applyTransform();
        }

        // Função para calcular o zoom máximo baseado no tamanho real da imagem
        function calculateMaxZoom(img) {
          if (!img) return 3; // Fallback

          const containerRect = container.getBoundingClientRect();
          const imgRect = img.getBoundingClientRect();

          // Calcula quanto a imagem pode ser ampliada para atingir seu tamanho real
          const scaleX = img.naturalWidth / imgRect.width;
          const scaleY = img.naturalHeight / imgRect.height;

          // Usa o menor dos dois para evitar distorção
          const naturalScale = Math.min(scaleX, scaleY);

          // Limita o zoom máximo para não ser muito grande
          return Math.min(naturalScale, 5);
        }

        // Funções auxiliares para pinch-to-zoom
        function getTouchDistance(touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        }

        function getTouchCenter(touches) {
          return {
            x: (touches[0].clientX + touches[1].clientX) / 2,
            y: (touches[0].clientY + touches[1].clientY) / 2,
          };
        }

        function handleWheel(e) {
          e.preventDefault();
          const delta = e.deltaY > 0 ? 0.9 : 1.1;
          const newZoom = Math.max(1, Math.min(maxZoom, currentZoom * delta)); // Zoom mínimo é 1

          // Se estamos voltando para o zoom 1, resetar a posição também
          if (newZoom === 1) {
            currentTranslate = { x: 0, y: 0 };
          }

          currentZoom = newZoom;
          updateZoomDisplay();
          applyTransform();
        }

        function handleMouseDown(e) {
          if (currentZoom <= 1) return;
          isDragging = true;
          dragStart = {
            x: e.clientX - currentTranslate.x,
            y: e.clientY - currentTranslate.y,
          };
          container.classList.add("dragging");
          e.preventDefault();
        }

        function handleMouseMove(e) {
          if (!isDragging || currentZoom <= 1) return;
          currentTranslate.x = e.clientX - dragStart.x;
          currentTranslate.y = e.clientY - dragStart.y;
          applyTransform();
        }

        function handleMouseUp() {
          isDragging = false;
          if (container) container.classList.remove("dragging");
        }

        function handleTouchStart(e) {
          if (e.touches.length === 2) {
            // Iniciar pinch-to-zoom
            e.preventDefault();
            isPinching = true;
            initialPinchDistance = getTouchDistance(e.touches);
            initialPinchZoom = currentZoom;
          } else if (e.touches.length === 1 && currentZoom > 1) {
            // Iniciar arrastar com um dedo
            isDragging = true;
            dragStart = {
              x: e.touches[0].clientX - currentTranslate.x,
              y: e.touches[0].clientY - currentTranslate.y,
            };
            container.classList.add("dragging");
          }
        }

        function handleTouchMove(e) {
          if (e.touches.length === 2 && isPinching) {
            // Pinch-to-zoom
            e.preventDefault();
            const currentDistance = getTouchDistance(e.touches);
            const scale = currentDistance / initialPinchDistance;
            const newZoom = Math.max(
              1,
              Math.min(maxZoom, initialPinchZoom * scale)
            ); // Zoom mínimo é 1

            // Se estamos voltando para o zoom 1, resetar a posição também
            if (newZoom === 1) {
              currentTranslate = { x: 0, y: 0 };
            }

            currentZoom = newZoom;
            updateZoomDisplay();
            applyTransform();
          } else if (e.touches.length === 1 && isDragging && currentZoom > 1) {
            // Arrastar com um dedo
            e.preventDefault();
            currentTranslate.x = e.touches[0].clientX - dragStart.x;
            currentTranslate.y = e.touches[0].clientY - dragStart.y;
            applyTransform();
          }
        }

        function handleTouchEnd(e) {
          if (e.touches.length === 0) {
            // Todos os dedos foram removidos
            isDragging = false;
            isPinching = false;
            if (container) container.classList.remove("dragging");
          } else if (e.touches.length === 1 && isPinching) {
            // Um dedo foi removido durante pinch, voltar para arrastar
            isPinching = false;
            if (currentZoom > 1) {
              isDragging = true;
              dragStart = {
                x: e.touches[0].clientX - currentTranslate.x,
                y: e.touches[0].clientY - currentTranslate.y,
              };
              container.classList.add("dragging");
            }
          }
        }

        function setupZoomControls() {
          // Event listeners para botões de zoom
          document.getElementById("zoom-in").addEventListener("click", zoomIn);
          document
            .getElementById("zoom-out")
            .addEventListener("click", zoomOut);
          document
            .getElementById("zoom-reset")
            .addEventListener("click", resetZoom);

          // Event listeners para mouse
          document.addEventListener("wheel", handleWheel, { passive: false });
          document.addEventListener("mousedown", handleMouseDown);
          document.addEventListener("mousemove", handleMouseMove);
          document.addEventListener("mouseup", handleMouseUp);

          // Event listeners para touch
          document.addEventListener("touchstart", handleTouchStart, {
            passive: false,
          });
          document.addEventListener("touchmove", handleTouchMove, {
            passive: false,
          });
          document.addEventListener("touchend", handleTouchEnd);

          // Mostrar controles após 3 segundos
          setTimeout(() => {
            zoomControls.classList.add("visible");
            setTimeout(() => {
              zoomControls.classList.remove("visible");
            }, 5000);
          }, 3000);
        }

        // Função para renderizar as unidades na tela
        function render(data) {
          const { unidades, imageUrl, dotSize } = data;
          wrapper.innerHTML = ""; // Limpa o conteúdo anterior

          // Armazena o dotSize globalmente para uso em atualizações
          window.currentDotSize = dotSize;

          if (!imageUrl) {
            wrapper.innerHTML =
              '<p style="padding:20px">Imagem da planta não configurada.</p>';
            return;
          }

          // Cria um contêiner para a imagem e os pontos, para manter a proporção
          container = document.createElement("div");
          container.className = "floor-plan-container";

          const img = document.createElement("img");
          img.src = imageUrl;
          img.className = "floor-plan-image";

          // Calcular maxZoom quando a imagem carregar
          img.onload = function () {
            maxZoom = calculateMaxZoom(img);
            console.log("[FULLSCREEN] Max zoom calculated:", maxZoom);
          };

          // Adiciona a imagem ao contêiner
          container.appendChild(img);

          // Adiciona o contêiner principal ao wrapper da página
          wrapper.appendChild(container);

          // Inicializa os controles de zoom
          setupZoomControls();

          // Pula o cabeçalho se a primeira linha parecer um
          const rows =
            unidades.length > 0 &&
            unidades[0][0]?.toString().toLowerCase().includes("etapa")
              ? unidades.slice(1)
              : unidades;

          rows.forEach((u, index) => {
            const coordX = u[11];
            const coordY = u[12];
            const status = (u[10] || "DISPONÍVEL").toString().toUpperCase();

            if (!coordX || !coordY) {
              return; // Pula unidades não mapeadas
            }

            const indicator = document.createElement("div");
            // Adiciona ID único para cada indicador baseado no índice da linha
            const unitIndex = index;
            indicator.id = `unit-indicator-${unitIndex}`;
            indicator.className = `unit-indicator status-${status}`;

            // Armazenar coordenadas originais nos atributos data
            indicator.setAttribute("data-original-x", coordX);
            indicator.setAttribute("data-original-y", coordY);

            indicator.style.left = `${coordX}%`;
            indicator.style.top = `${coordY}%`;

            // Tamanho responsivo dos pontos baseado na tela
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const baseSize = Math.min(screenWidth, screenHeight) / 50; // Baseado em 2% da menor dimensão da tela
            const responsiveDotSize = Math.max(8, Math.min(24, baseSize)); // Entre 8px e 24px

            indicator.style.width = `${responsiveDotSize}px`;
            indicator.style.height = `${responsiveDotSize}px`;
            indicator.title = `Unidade: ${u[2]}
Status: ${status}`;

            container.appendChild(indicator); // Adiciona o ponto ao contêiner da imagem
          });
        }

        // Função para recarregar e renderizar os dados
        async function reloadAndRender(hideAvailable = "false") {
          statusEl.textContent = "Atualizando...";
          const data = await fetchData(hideAvailable);
          render(data);
          statusEl.textContent = "Conectado";
        }

        // Conexão com Server-Sent Events (SSE)
        let es;
        function connectSse() {
          if (es) es.close();

          es = new EventSource(
            `/api/events?implantacao=${encodeURIComponent(implantacao)}`
          );

          es.onopen = () => {
            statusEl.textContent = "Conectado em tempo real";
          };

          es.onerror = () => {
            statusEl.textContent = "Erro na conexão. Reconectando...";
            // Tenta reconectar após um tempo
            setTimeout(connectSse, 5000);
          };

          es.addEventListener("unitUpdated", async (ev) => {
            try {
              const { unitData, rowIndex } = JSON.parse(ev.data);
              console.log("Evento 'unit-updated' recebido:", {
                unitData,
                rowIndex,
              });
              updateSingleUnit(unitData, rowIndex);
            } catch (e) {
              console.error("Erro ao processar evento SSE:", e);
            }
          });
        }

        // Nova função para atualizar uma única unidade
        function updateSingleUnit(unitData, rowIndex) {
          if (!container) return;

          // O índice do array é rowIndex - 2
          // O array de unidades no frontend começa na linha 2 da planilha (índice 0)
          const unitIndex = rowIndex - 2;
          const unitId = `unit-indicator-${unitIndex}`;
          let indicator = document.getElementById(unitId);

          const coordX = unitData[11];
          const coordY = unitData[12];
          const status = (unitData[10] || "DISPONÍVEL")
            .toString()
            .toUpperCase();

          // Se não há coordenadas, remove o indicador se existir
          if (!coordX || !coordY) {
            if (indicator) {
              indicator.remove();
            }
            return;
          }

          if (!indicator) {
            indicator = document.createElement("div");
            indicator.id = unitId;
            indicator.className = "unit-indicator";
            container.appendChild(indicator);
          }

          // Atualiza as propriedades do indicador
          indicator.className = `unit-indicator status-${status}`;

          // Armazenar coordenadas originais se ainda não foram salvas
          if (!indicator.hasAttribute("data-original-x")) {
            indicator.setAttribute("data-original-x", coordX);
            indicator.setAttribute("data-original-y", coordY);
          }

          indicator.style.left = `${coordX}%`;
          indicator.style.top = `${coordY}%`;
          indicator.title = `Unidade: ${unitData[2]}\nStatus: ${status}`;

          // Tamanho responsivo dos pontos baseado na tela
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;
          const baseSize = Math.min(screenWidth, screenHeight) / 50; // Baseado em 2% da menor dimensão da tela
          const responsiveDotSize = Math.max(8, Math.min(24, baseSize)); // Entre 8px e 24px

          indicator.style.width = `${responsiveDotSize}px`;
          indicator.style.height = `${responsiveDotSize}px`;

          console.log(
            `[FULLSCREEN] Unidade ${unitData[2]} atualizada para status: ${status}`
          );
        }

        // Carga inicial e início da conexão em tempo real
        reloadAndRender(urlParams.get("hideAvailable") || "false");
        connectSse();

        // Lógica do botão de Tela Cheia
        fullscreenBtn.addEventListener("click", () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch((err) => {
              alert(
                `Erro ao tentar ativar tela cheia: ${err.message} (${err.name})`
              );
            });
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            }
          }
        });

        // Detectar mudanças no modo tela cheia
        document.addEventListener("fullscreenchange", () => {
          console.log("[FULLSCREEN] fullscreenchange event fired");
          console.log(
            "[FULLSCREEN] document.fullscreenElement:",
            document.fullscreenElement
          );

          if (document.fullscreenElement) {
            // Entrou em tela cheia - ocultar header e mostrar controles de zoom
            console.log("[FULLSCREEN] Entering fullscreen mode");
            hideTopbar();
            zoomControls.classList.add("visible");
            zoomInstructions.classList.add("visible");
            fullscreenBtn.innerHTML = `
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
              </svg>
            `;
            fullscreenBtn.title = "Sair da Tela Cheia";
          } else {
            // Saiu da tela cheia - mostrar header e ocultar controles de zoom
            console.log("[FULLSCREEN] Exiting fullscreen mode");
            showTopbar();
            zoomControls.classList.remove("visible");
            zoomInstructions.classList.remove("visible");
            fullscreenBtn.innerHTML = `
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
              </svg>
            `;
            fullscreenBtn.title = "Ativar Tela Cheia";
          }
        });

        // Lógica de controle do header (só oculta quando fullscreen é ativado)
        const topbar = document.querySelector(".topbar");
        let isFullscreenMode = false;
        let lastHideTime = 0;
        const HIDE_COOLDOWN = 500; // 500ms cooldown após hideTopbar()

        function showTopbar() {
          console.log("[FULLSCREEN] showTopbar() called");

          // Verificar se estamos no cooldown após hideTopbar()
          const timeSinceHide = Date.now() - lastHideTime;
          if (timeSinceHide < HIDE_COOLDOWN) {
            console.log(
              `[FULLSCREEN] Blocking showTopbar() - cooldown active (${timeSinceHide}ms)`
            );
            return;
          }

          topbar.classList.remove("hidden");
          wrapper.classList.remove("fullscreen");
          isFullscreenMode = false;

          // Remover modo fullscreen da imagem, container e pontos
          if (container) {
            container.classList.remove("fullscreen-mode");
          }
          const img = document.querySelector(".floor-plan-image");
          if (img) {
            img.classList.remove("fullscreen-mode");
          }
          // Remover fullscreen-mode de todos os pontos
          const indicators = document.querySelectorAll(".unit-indicator");
          indicators.forEach((indicator) => {
            indicator.classList.remove("fullscreen-mode");
          });

          // Forçar recálculo das posições após mudança de modo
          setTimeout(() => {
            updateUnitPositions();
          }, 100);
        }

        function hideTopbar() {
          console.log("[FULLSCREEN] hideTopbar() called");
          console.log("[FULLSCREEN] topbar element:", topbar);

          lastHideTime = Date.now();
          topbar.classList.add("hidden");
          wrapper.classList.add("fullscreen");
          isFullscreenMode = true;

          // Aplicar modo fullscreen à imagem, container e pontos
          if (container) {
            container.classList.add("fullscreen-mode");
          }
          const img = document.querySelector(".floor-plan-image");
          if (img) {
            img.classList.add("fullscreen-mode");
          }
          // Aplicar fullscreen-mode a todos os pontos
          const indicators = document.querySelectorAll(".unit-indicator");
          indicators.forEach((indicator) => {
            indicator.classList.add("fullscreen-mode");
          });

          // Forçar recálculo das posições após mudança de modo
          setTimeout(() => {
            updateUnitPositions();
          }, 100);
        }

        // Event listeners para mostrar header quando houver interação (apenas fora do fullscreen)
        function showHeaderOnInteraction(event) {
          console.log("[FULLSCREEN] Interaction event:", event.type);
          if (!isFullscreenMode) {
            console.log("[FULLSCREEN] Showing header due to interaction");
            showTopbar();
          }
        }

        document.addEventListener("mousemove", showHeaderOnInteraction);
        document.addEventListener("mousedown", showHeaderOnInteraction);
        document.addEventListener("keydown", showHeaderOnInteraction);
        document.addEventListener("touchstart", showHeaderOnInteraction);
        document.addEventListener("touchmove", showHeaderOnInteraction);

        // Mostrar header ao passar o mouse sobre a área do header (apenas fora do fullscreen)
        topbar.addEventListener("mouseenter", () => {
          if (!isFullscreenMode) {
            console.log("[FULLSCREEN] Showing header due to mouseenter");
            showTopbar();
          }
        });

        // Header sempre visível por padrão
        showTopbar();

        // Otimizações de desempenho para mobile
        let resizeTimeout;
        let orientationTimeout;
        let animationFrameId = null;

        // Função de debouncing para otimizar performance
        function debounce(func, wait) {
          return function executedFunction(...args) {
            const later = () => {
              clearTimeout(resizeTimeout);
              func(...args);
            };
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(later, wait);
          };
        }

        // Função otimizada para usar requestAnimationFrame
        function requestAnimationFrameUpdate(callback) {
          if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
          }
          animationFrameId = requestAnimationFrame(callback);
        }

        // Função otimizada para atualizar posições com performance
        function optimizedUpdateUnitPositions() {
          requestAnimationFrameUpdate(() => {
            updateUnitPositions();
          });
        }

        // Listener para mudanças de orientação/orientação da tela (mobile) - com debouncing
        window.addEventListener("orientationchange", () => {
          console.log(
            "[FULLSCREEN] Orientation changed, recalculating positions"
          );
          clearTimeout(orientationTimeout);
          orientationTimeout = setTimeout(() => {
            optimizedUpdateUnitPositions();
          }, 300); // Delay maior para garantir que a orientação foi completamente aplicada
        });

        // Listener para resize da janela (desktop) - com debouncing
        const debouncedResize = debounce(() => {
          console.log("[FULLSCREEN] Window resized, recalculating positions");
          optimizedUpdateUnitPositions();
        }, 150);

        window.addEventListener("resize", debouncedResize);

        // Otimização para touch events - reduzir frequência de processamento
        let touchThrottleTimeout;
        function throttleTouchEvents(callback, delay = 16) {
          // ~60fps
          if (!touchThrottleTimeout) {
            touchThrottleTimeout = setTimeout(() => {
              callback();
              touchThrottleTimeout = null;
            }, delay);
          }
        }

        // Otimizar transformações aplicadas durante drag
        function optimizedApplyTransform() {
          if (!container) return;

          requestAnimationFrameUpdate(() => {
            container.style.transform = `translate(${currentTranslate.x}px, ${currentTranslate.y}px) scale(${currentZoom})`;
            container.classList.toggle("zoomed", currentZoom > 1);

            // Só atualizar posições dos pontos se não estiver arrastando (para performance)
            if (!isDragging) {
              updateUnitPositions();
            }
          });
        }

        // Substituir applyTransform pela versão otimizada
        applyTransform = optimizedApplyTransform;
      })();
    </script>
  </body>
</html>
